<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xal1tube | Видеохостинг</title>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Окно авторизации -->
<div id="authModal" class="watch-page" style="display: flex; align-items: center; justify-content: center; z-index: 5000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f0f;">
    <div style="background: #1f1f1f; padding: 30px; border-radius: 12px; width: 300px; text-align: center; border: 1px solid #383838;">
        <h2 style="margin-top:0;">Вход в xal1tube</h2>
        <input type="text" id="authName" class="inp" placeholder="Логин">
        <input type="password" id="authPass" class="inp" placeholder="Пароль">
        <button class="btn btn-red full-width" onclick="handleAuth()">Войти / Зарегистрироваться</button>
        <p id="authMsg" style="color: #ff4444; font-size: 12px; margin-top: 10px;"></p>
    </div>
</div>

<header>
    <div class="header-left">
        <button class="icon-btn" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
        <a href="#" class="logo" onclick="location.reload()">xal1<span>tube</span></a>
    </div>
    
    <div class="search-bar-container">
        <input type="text" id="vSearch" placeholder="Введите запрос..." oninput="searchVideos()">
        <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="header-right">
        <button class="btn btn-red" onclick="toggleSide()"><i class="fa-solid fa-video"></i> Создать</button>
        <img id="hAv" class="avatar-small" onclick="toggleSide()" alt="Avatar">
    </div>
</header>

<div class="main-layout">
    <nav id="sideNav" class="sidebar">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i> Главная</a>
        <hr class="nav-divider">
        <div class="nav-title">Мой аккаунт</div>
        <a href="#" class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Выйти</a>
    </nav>

    <main class="content">
        <div class="grid" id="vGrid"></div>
    </main>
</div>

<!-- Просмотр видео -->
<div id="watchPage" style="display:none;">
    <div class="watch-container">
        <button class="btn back-btn" onclick="closeWatch()"><i class="fa-solid fa-arrow-left"></i> Назад</button>
        <div id="pBox" class="player-box"></div>
        <h1 id="vTitle" class="watch-title"></h1>
        
        <div class="watch-meta">
            <div class="channel-info">
                <img id="vAuthAv" class="avatar-medium" alt="Avatar">
                <div>
                    <div id="vAuthName" class="channel-name"></div>
                    <div class="sub-count">Автор</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-action" onclick="vote('likes')"><i class="fa-solid fa-thumbs-up"></i> <span id="vLikes">0</span></button>
                <button class="btn btn-action" onclick="vote('dislikes')"><i class="fa-solid fa-thumbs-down"></i> <span id="vDis">0</span></button>
            </div>
        </div>

        <div class="video-description-box">
            <span id="vViews" class="bold-text">0 просмотров</span> • <span id="vDate"></span>
            <p id="vDesc" class="desc-text"></p>
        </div>

        <div class="comments-section">
            <h3>Комментарии</h3>
            <div class="add-comment">
                <input type="text" id="cInp" class="inp" placeholder="Оставьте комментарий...">
                <button class="btn btn-red" onclick="sendComm()">Отправить</button>
            </div>
            <div id="cList" class="comments-list"></div>
        </div>
    </div>
</div>

<!-- Загрузка видео -->
<div id="sideMenu" class="drawer">
    <button class="close-btn" onclick="toggleSide()">&times;</button>
    <div class="drawer-section">
        <h3><i class="fa-solid fa-upload"></i> Опубликовать видео</h3>
        <input type="text" id="vT" class="inp" placeholder="Название видео">
        <textarea id="vD" class="inp" placeholder="Описание..." rows="3"></textarea>
        
        <label class="input-label">Прямая ссылка на MP4 (например с catbox.moe):</label>
        <input type="text" id="vUrl" class="inp" placeholder="https://files.catbox.moe/sample.mp4">
        
        <button id="upB" class="btn btn-red full-width" onclick="uploadVideo()">ОПУБЛИКОВАТЬ</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
